name: 設定の検証とリリース

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: テストと版の整合性
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 手動リリースの対象ブランチを確認
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "リリースは main を選択して実行してください。" >&2
            exit 1
          fi
      - name: 対象コミットを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: manifest と版の整合性を検証
        run: python3 scripts/release.py check
      - name: 全テストを実行
        run: python3 -m unittest discover -s tests -v

  release:
    name: 検証済みコミットへタグを作成
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: config-release
      cancel-in-progress: false
    steps:
      - name: 検証と同じコミットを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: 既存タグを変更せずリリースタグを作成
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/release.py tag --commit "$RELEASE_COMMIT"
